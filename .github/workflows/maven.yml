# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Maven deploy Snapshots

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21, 25 ]
    name: Java ${{ matrix.java }} build

    services:
      mysql:
        image: mysql:8
        credentials:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: peppol
          MYSQL_DATABASE: peppol-report
          MYSQL_USER: peppol
          MYSQL_PASSWORD: peppol
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        credentials:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          ORACLE_RANDOM_PASSWORD: "true"
          ORACLE_DATABASE: ORCLPDB1
          APP_USER: peprep
          APP_USER_PASSWORD: peprep
        ports:
          - 1521:1521
        options: --health-cmd="healthcheck.sh" --health-interval=10s --health-timeout=5s --health-retries=30 --health-start-period=30s

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Peppol_Strong!Pass1"
        ports:
          - 1433:1433
        options: --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Peppol_Strong!Pass1' -C -Q 'SELECT 1' || exit 1" --health-interval=10s --health-timeout=5s --health-retries=10 --health-start-period=10s

    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # DB2 needs a privileged container, so it cannot be a service container.
    # Started as early as possible, because the initial setup takes several minutes.
    - name: Start DB2
      run: docker run -itd --name db2 --privileged=true --memory=4g -p 50000:50000 -e LICENSE=accept -e DB2INST1_PASSWORD=peppol -e DBNAME=pepprep icr.io/db2_community/db2

    - uses: actions/checkout@v6

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD

    - name: Cache local Maven repository
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.10.0
      with:
        mongodb-version: '6.0'

    - name: Start PostgreSQL
      uses: ikalnytskyi/action-setup-postgres@v6
      with:
        username: peppol
        password: peppol
        database: peppol-report
        port: 5432
      id: postgres

    - name: Create SQL Server database
      run: docker exec $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest") /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Peppol_Strong!Pass1' -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'peppol-report') CREATE DATABASE [peppol-report];"

    - name: Wait for DB2 and create test user
      run: |
        # A successful "db2 connect" alone is not sufficient. The database is already
        # connectable while the entrypoint still runs enable_log_archiving, restart_db2
        # and run_autoconfig - statements issued in that window fail with SQL1224N.
        # The setup_complete marker file is written after all of that is done.
        echo "Waiting for DB2 setup to complete"
        for i in $(seq 1 90); do
          if docker exec db2 test -f /database/config/.shared-data/setup_complete && \
             docker exec db2 su - db2inst1 -c "db2 connect to pepprep" > /dev/null 2>&1; then
            echo "DB2 setup completed after $i attempt(s)"
            break
          fi
          if [ "$i" = "90" ]; then
            echo "DB2 setup did not complete in time"
            docker logs db2
            exit 1
          fi
          sleep 10
        done
        # DB2 authenticates against operating system users - the group db2iadm1 is required
        docker exec db2 bash -c "useradd -m -s /bin/bash -g db2iadm1 peppol && echo 'peppol:peppol' | chpasswd"
        # The GRANT must be quoted, otherwise the CLP does not receive it as a single statement
        docker exec db2 su - db2inst1 -c "db2 connect to pepprep && db2 'GRANT DBADM ON DATABASE TO USER PEPPOL' && db2 connect reset"
        docker exec db2 su - db2inst1 -c "db2 connect to pepprep user peppol using peppol && db2 connect reset"

    - name: Publish to the Maven Central Repository
      run: mvn --batch-mode --update-snapshots -P release-snapshot deploy
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.java == 17
      env:
        MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

    - name: Maven Build
      run: mvn --batch-mode --update-snapshots install
      if: github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || matrix.java != 17
