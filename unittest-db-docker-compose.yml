# This Docker compose file starts up local database instances for SMP building
# Run like this:
# docker compose -f unittest-db-docker-compose.yml up
# docker compose -f unittest-db-docker-compose.yml down
services:
  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_DATABASE: peppol-report-test
    ports:
      - "27017:27017"

  postgres:
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: peppol-report
      POSTGRES_USER: peppol
      POSTGRES_PASSWORD: peppol
    volumes:
      - pg18data:/var/lib/postgresql
 
#  pg-adminer:
#    image: adminer
#    restart: always
#    ports:
#      - 8080:8080
 
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: peppol-report
      MYSQL_USER: peppol
      MYSQL_PASSWORD: peppol
    ports:
      - "3306:3306"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Peppol_Strong!Pass1"
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Peppol_Strong!Pass1" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "Peppol_Strong!Pass1" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'peppol-report') CREATE DATABASE [peppol-report];"

  # The initial DB2 setup takes several minutes.
  # The "peppol" user needs to be created once afterwards - see docs/db2.md
  db2:
    image: icr.io/db2_community/db2:latest
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: peppol
      DBNAME: pepprep
    ports:
      - "50000:50000"
    healthcheck:
      # The setup_complete marker is required: the database is already connectable while
      # the entrypoint still restarts the instance for log archiving and autoconfiguration
      test: test -f /database/config/.shared-data/setup_complete && su - db2inst1 -c "db2 connect to pepprep" || exit 1
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 60s

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_RANDOM_PASSWORD: "true"
      ORACLE_DATABASE: ORCLPDB1
      APP_USER: peprep
      APP_USER_PASSWORD: peprep
    ports:
      - "1521:1521"
    healthcheck:
      test: healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pg18data:

